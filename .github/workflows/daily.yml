# The daily in-season job (scraper/update_season.py), run by GitHub instead of
# launchd on a desktop. Same steps as scraper/schedule/run_daily.sh, minus the
# parts a fresh runner doesn't need: it always has the latest main and a clean
# venv, and GitHub emails whoever last edited this file when a run fails.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions),
# the same values as .env.local: DATABASE_URL, BALLDONTLIE_API_KEY,
# NEXT_PUBLIC_SITE_URL, and REVALIDATE_SECRET.
#
# Run it by hand from the Actions tab (Run workflow), optionally for a season.

name: Daily update

on:
  schedule:
    # 15:30 UTC: 7:30am Pacific in winter, 8:30am in summer. Every West Coast
    # game is final by then. Off the top of the hour, when GitHub's scheduler
    # is busiest and runs start late.
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season, e.g. 2026-27 (blank for the one in progress)"
        required: false
        default: ""

# Never two runs writing to the database at once.
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      # Matches the local venv's Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run update_season.py
        env:
          SEASON: ${{ inputs.season }}
        run: python update_season.py $SEASON

      # The unmatched/collision reports the run rewrites. Not committed back;
      # download them from the run page when a match needs fixing.
      - name: Save match reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-reports
          path: scraper/*.csv
          retention-days: 14
