# The BALLDONTLIE half of the daily job (scraper/update_season.py --bdl): stats,
# team splits, rosters, salaries, and future contracts, then production, net
# values, and a revalidate. The bref half runs from launchd on the desktop
# (scraper/schedule/run_daily.sh), since bref blocks cloud addresses; neither
# waits on the other, so the day's stats land even when bref fails.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions),
# the same values as .env.local: DATABASE_URL, BALLDONTLIE_API_KEY,
# NEXT_PUBLIC_SITE_URL, and REVALIDATE_SECRET.
#
# GitHub emails whoever last edited this file when a run fails. Run it by hand
# from the Actions tab (Run workflow), optionally for a season.

name: Daily update (BALLDONTLIE)

on:
  schedule:
    # 2am Pacific, year round. GitHub's cron is UTC and ignores daylight
    # saving, so both candidates are scheduled and the "2am Pacific?" step
    # below lets through only the one that is 2am today: 09:00 UTC under
    # daylight time (PDT), 10:00 UTC under standard time (PST). It goes by
    # which schedule fired, not the clock, so a run GitHub starts late still
    # counts. Every West Coast game is final by then.
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season, e.g. 2026-27 (blank for the one in progress)"
        required: false
        default: ""

# Never two of these at once. The desktop's bref job can overlap; the model's
# writes take a database lock for that (scraper/db.py lock_writes).
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 2am Pacific?
        id: gate
        working-directory: .
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          if [ -z "$FIRED" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=America/Los_Angeles date +%Z)" = "PDT" ]; then want="0 9 * * *"; else want="0 10 * * *"; fi
          if [ "$FIRED" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: the $FIRED UTC schedule isn't 2am Pacific today."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      # Not the local venv's 3.9: GitHub's Ubuntu 26.04 runners only offer
      # 3.10 and newer. Every pinned requirement has a 3.12 wheel.
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Run update_season.py --bdl
        if: steps.gate.outputs.run == 'true'
        env:
          SEASON: ${{ inputs.season }}
        run: python update_season.py --bdl $SEASON

      # The unmatched/collision reports the run rewrites. Not committed back;
      # download them from the run page when a match needs fixing.
      - name: Save match reports
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: match-reports
          path: scraper/*.csv
          if-no-files-found: ignore
          retention-days: 14
